<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-labelledby="title desc">
  <title id="title">Logo AVERRA</title>
  <desc id="desc">Logo AVERRA berwarna biru tua dan emas dengan figur, huruf A, orbit, dan bintang.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a5"/>
      <stop offset="0.35" stop-color="#f4c542"/>
      <stop offset="0.68" stop-color="#c88900"/>
      <stop offset="1" stop-color="#8f5a00"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123f77"/>
      <stop offset="0.55" stop-color="#0E2A47"/>
      <stop offset="1" stop-color="#071b2e"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="220" height="220" rx="20" fill="#fff"/>

  <!-- Blue A foundation -->
  <path d="M43 185 92 91c5-10 13-16 22-16 9 0 17 6 22 16l42 94h-33l-31-70-34 70Z" fill="url(#blue)" filter="url(#shadow)"/>
  <path d="M95 151h42l10 23H84Z" fill="#fff" opacity="0.98"/>

  <!-- Gold human / upward movement -->
  <circle cx="94" cy="60" r="13" fill="url(#gold)" filter="url(#shadow)"/>
  <path d="M72 155c18-23 25-48 29-68 7 22 18 34 31 39 14-22 21-43 24-67 4 31-4 62-25 88-16 19-36 32-62 39 14-11 24-21 31-31-11 8-21 14-28 16Z" fill="url(#gold)" filter="url(#shadow)"/>
  <path d="M68 155c11-35 19-57 35-76-8 33-18 61-35 76Z" fill="#ffe07a" opacity="0.72"/>

  <!-- Orbit -->
  <path d="M31 156c21 28 76 32 127 13 30-11 48-27 43-37-5-10-31-10-65 2" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M31 156c-7-10 3-23 27-36" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>

  <!-- Star -->
  <path d="m159 24 5 11 12 1-9 8 3 12-11-6-10 6 2-12-9-8 12-1Z" fill="url(#gold)" filter="url(#shadow)"/>
</svg>
