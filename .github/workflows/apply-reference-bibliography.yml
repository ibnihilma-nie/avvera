name: Apply Reference Bibliography

on:
  push:
    paths:
      - '.github/workflows/apply-reference-bibliography.yml'

permissions:
  contents: write

jobs:
  patch-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch ReferenceView
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import base64

          path = Path('app-base.html')
          text = path.read_text(encoding='utf-8')
          start_marker = 'const ReferenceView = () => {'
          end_marker = 'const VRMuseumView = () => {'
          start = text.index(start_marker)
          end = text.index(end_marker)

          component_b64 = ''''''
          component = base64.b64decode(component_b64).decode('utf-8')
          patched = text[:start] + component + text[end:]
          path.write_text(patched, encoding='utf-8')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-base.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Improve AVERRA references as accessible bibliography"
          git push
