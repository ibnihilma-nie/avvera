// --- REUSABLE UI COMPONENTS ---
const Card = ({ children, className = "", onClick }) => (
  <div
    onClick={onClick}
    className={`bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden transition-all duration-300 ${onClick ? 'cursor-pointer hover:shadow-md hover:-translate-y-1' : ''} ${className}`}
  >
    {children}
  </div>
);
 
const Button = ({ children, variant = 'primary', className = "", onClick, disabled }) => {
  const baseStyle = "font-semibold rounded-xl transition-all duration-200 flex items-center justify-center active:scale-95 disabled:opacity-50 disabled:active:scale-100 disabled:cursor-not-allowed";
  const variants = {
    primary: "bg-[#C99700] text-white hover:bg-[#b08400] shadow-[0_4px_0_#967100] hover:shadow-[0_2px_0_#967100] hover:translate-y-[2px] px-6 py-3",
    secondary: "bg-[#0E2A47] text-white hover:bg-[#163a5f] shadow-[0_4px_0_#091b2e] hover:shadow-[0_2px_0_#091b2e] hover:translate-y-[2px] px-6 py-3",
    outline: "bg-white text-[#0E2A47] border-2 border-[#0E2A47] hover:bg-slate-50 px-6 py-3",
    ghost: "bg-transparent text-slate-600 hover:bg-slate-100 px-4 py-2",
    success: "bg-emerald-500 text-white hover:bg-emerald-600 shadow-[0_4px_0_#047857] hover:shadow-[0_2px_0_#047857] hover:translate-y-[2px] px-6 py-3",
  };
  return (
    <button onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${className}`}>
      {children}
    </button>
  );
};
 
const ProgressBar = ({ progress, color = "bg-[#C99700]", height = "h-3" }) => (
  <div className={`w-full bg-slate-200 rounded-full ${height} overflow-hidden`}>
    <div
      className={`${height} ${color} rounded-full transition-all duration-1000 ease-out`}
      style={{ width: `${progress}%` }}
    />
  </div>
);
 
const Badge = ({ children, icon: Icon, color = "bg-blue-100 text-blue-700", className="" }) => (
  <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${color} ${className}`}>
    {Icon && <Icon className="w-3 h-3 mr-1" />}
    {children}
  </span>
);
 
const getInitials = (name) => name
  .replace(/^(KH\.|Syekh|Ibnu|Al-|As-|Ar-)\s*/i, '')
  .split(' ')
  .filter(Boolean)
  .slice(0, 2)
  .map(w => w[0])
  .join('')
  .toUpperCase();
 
const ScholarAvatar = ({ scholar, size = "w-14 h-14", textSize = "text-sm" }) => {
  const [errored, setErrored] = useState(false);
  if (scholar.img && !errored) {
    return (
      <img
        src={scholar.img}
        alt={scholar.name}
        onError={() => setErrored(true)}
        className={`${size} rounded-full object-cover border-2 border-white shadow-sm flex-shrink-0`}
      />
    );
  }
  return (
    <div className={`${size} rounded-full bg-gradient-to-br from-[#0E2A47] to-[#1a4a7d] text-white flex items-center justify-center font-bold ${textSize} flex-shrink-0 border-2 border-white shadow-sm`}>
      {getInitials(scholar.name)}
    </div>
  );
};

const shuffleArray = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
 
const ChallengeRunner = ({ type, onComplete, onCancel }) => {
  const [step, setStep] = useState(0);
  const [score, setScore] = useState(0);
  const [showFeedback, setShowFeedback] = useState(null);
  const [streak, setStreak] = useState(0);
  const [finished, setFinished] = useState(false);
  const [earnedBadge, setEarnedBadge] = useState(null);
 
  const scholarQuestions = CHALLENGE_QUESTION_BANKS.scholar;
  const techPairs = CHALLENGE_QUESTION_BANKS.technology;
  const timelineRounds = CHALLENGE_QUESTION_BANKS.innovation;
  const memoryScholars = CHALLENGE_QUESTION_BANKS.master;
 
  const [matches, setMatches] = useState([]);
  const [selectedLeft, setSelectedLeft] = useState(null);
  const [shuffledRight] = useState(() => shuffleArray(techPairs));
 
  const [orderedItems, setOrderedItems] = useState(() => shuffleArray(timelineRounds[0].items));
  const [draggedIdx, setDraggedIdx] = useState(null);
  const [timelineChecked, setTimelineChecked] = useState(false);
  const [timelineCorrect, setTimelineCorrect] = useState(false);
 
  const [cards, setCards] = useState(() => shuffleArray(
    memoryScholars.flatMap(s => [{ ...s, key: s.id + '-a' }, { ...s, key: s.id + '-b' }])
  ));
  const [flipped, setFlipped] = useState([]);
  const [solved, setSolved] = useState([]);
  const [moves, setMoves] = useState(0);
 
  const finishWithScore = (finalScore) => {
    setEarnedBadge(ACHIEVEMENT_RULES[type]);
    setFinished(true);
    setTimeout(() => onComplete(finalScore, ACHIEVEMENT_RULES[type].badge), 1800);
  };
 
  const handleQuizAnswer = (idx) => {
    const isCorrect = idx === scholarQuestions[step].answer;
    setShowFeedback(isCorrect ? 'correct' : 'wrong');
    let gained = 0;
    if (isCorrect) {
      const newStreak = streak + 1;
      const streakBonus = newStreak >= 3 ? 20 : 0;
      gained = 40 + streakBonus;
      setStreak(newStreak);
      setScore(s => s + gained);
    } else {
      setStreak(0);
    }
 
    setTimeout(() => {
      setShowFeedback(null);
      if (step < scholarQuestions.length - 1) {
        setStep(s => s + 1);
      } else {
        finishWithScore(score + gained);
      }
    }, 1200);
  };
 
  const handleMatch = (rightId) => {
    if (!selectedLeft) return;
    if (selectedLeft === rightId) {
      const newMatches = [...matches, rightId];
      setMatches(newMatches);
      setScore(s => s + 30);
      setSelectedLeft(null);
      if (newMatches.length === techPairs.length) {
        setTimeout(() => finishWithScore(score + 30), 800);
      }
    } else {
      setScore(s => Math.max(0, s - 5));
      setSelectedLeft(null);
    }
  };
 
  const handleDragStart = (idx) => setDraggedIdx(idx);
  const handleDrop = (idx) => {
    if (draggedIdx === null || draggedIdx === idx) return;
    setOrderedItems(prev => {
      const next = [...prev];
      const [moved] = next.splice(draggedIdx, 1);
      next.splice(idx, 0, moved);
      return next;
    });
    setDraggedIdx(null);
  };
  const checkTimeline = () => {
    const isCorrect = JSON.stringify(orderedItems) === JSON.stringify(timelineRounds[step].items);
    setTimelineChecked(true);
    setTimelineCorrect(isCorrect);
    const gained = isCorrect ? 60 : 15;
    setScore(s => s + gained);
    setTimeout(() => {
      setTimelineChecked(false);
      if (step < timelineRounds.length - 1) {
        setStep(s => s + 1);
        setOrderedItems(shuffleArray(timelineRounds[step + 1].items));
      } else {
        finishWithScore(score + gained);
      }
    }, 1600);
  };
 
  const handleCardFlip = (key) => {
    if (flipped.length === 2 || flipped.includes(key) || solved.includes(key)) return;
    const newFlipped = [...flipped, key];
    setFlipped(newFlipped);
    if (newFlipped.length === 2) {
      setMoves(m => m + 1);
      const [a, b] = newFlipped.map(k => cards.find(c => c.key === k));
      if (a.id === b.id) {
        const newSolved = [...solved, a.key, b.key];
        setSolved(newSolved);
        setScore(s => s + 25);
        setFlipped([]);
        if (newSolved.length === cards.length) {
          setTimeout(() => finishWithScore(score + 25), 800);
        }
      } else {
        setTimeout(() => setFlipped([]), 800);
      }
    }
  };
 
  return (
    <div className="max-w-3xl mx-auto h-full flex flex-col pt-8">
      <div className="flex items-center justify-between mb-8">
        <Button variant="ghost" onClick={onCancel}><XCircle className="w-6 h-6 mr-2"/> Exit Challenge</Button>
        <div className="flex items-center space-x-3">
           {streak >= 2 && type === 'scholar' && (
             <Badge color="bg-orange-100 text-orange-700"><Zap className="w-3 h-3 mr-1"/> {streak}x Streak</Badge>
           )}
           <Badge color="bg-amber-100 text-amber-700 text-lg py-1 px-4"><Star className="w-5 h-5 mr-1 text-amber-500"/> {score}</Badge>
        </div>
      </div>
 
      <div className="bg-white rounded-3xl p-8 shadow-lg border border-slate-200 flex-1 relative overflow-hidden">
 
        {finished && (
          <div className="absolute inset-0 z-20 bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center text-center p-8">
            <div className="w-20 h-20 bg-amber-100 rounded-full flex items-center justify-center mb-4" style={{animation: 'bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards'}}>
              <Trophy className="w-10 h-10 text-amber-500" />
            </div>
            <h3 className="text-2xl font-bold text-slate-800 mb-1">Tantangan Selesai!</h3>
            <p className="text-slate-500 mb-3">Skor akhir: <span className="font-bold text-[#C99700]">{score}</span></p>
            {earnedBadge && (
              <Badge color="bg-emerald-100 text-emerald-700 text-sm py-1.5 px-3"><Shield className="w-4 h-4 mr-1"/> Lencana baru: {earnedBadge.badge}</Badge>
            )}
          </div>
        )}
 
        {type === 'scholar' && (
          <div className="flex flex-col h-full">
            <div className="mb-8">
              <ProgressBar progress={(step / scholarQuestions.length) * 100} height="h-2" color="bg-blue-500" />
              <p className="text-right text-sm text-slate-500 mt-2">Question {step + 1} of {scholarQuestions.length}</p>
            </div>
 
            <h2 className="text-2xl font-bold text-center mb-8">{scholarQuestions[step].q}</h2>
 
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-auto">
              {scholarQuestions[step].options.map((opt, idx) => (
                <Button
                  key={idx}
                  variant="outline"
                  className={`h-20 text-lg border-2 ${showFeedback ? 'pointer-events-none' : ''}`}
                  onClick={() => handleQuizAnswer(idx)}
                >
                  {opt}
                </Button>
              ))}
            </div>
 
            {showFeedback && (
              <div className={`absolute bottom-0 left-0 right-0 p-6 flex items-center justify-between
                ${showFeedback === 'correct' ? 'bg-emerald-500 text-white' : 'bg-red-500 text-white'}
              `} style={{animation: 'slideUp 0.3s ease-out forwards'}}>
                <div className="flex items-center">
                  {showFeedback === 'correct' ? <CheckCircle2 className="w-10 h-10 mr-4"/> : <XCircle className="w-10 h-10 mr-4"/>}
                  <h3 className="text-2xl font-bold">{showFeedback === 'correct' ? (streak + 1 >= 3 ? 'Excellent! +Streak Bonus' : 'Excellent!') : 'Not quite right'}</h3>
                </div>
              </div>
            )}
          </div>
        )}
 
        {type === 'technology' && (
          <div>
            <h2 className="text-2xl font-bold text-center mb-2">Connect the Concepts</h2>
            <p className="text-center text-slate-500 mb-8">Tap a Scholar, then tap their modern technological legacy. Wrong pairs cost points!</p>
 
            <div className="flex justify-between items-stretch gap-8">
              <div className="flex-1 space-y-4">
                {techPairs.map(pair => {
                  const isMatched = matches.includes(pair.id);
                  const isSelected = selectedLeft === pair.id;
                  return (
                    <div
                      key={`left-${pair.id}`}
                      onClick={() => !isMatched && setSelectedLeft(pair.id)}
                      className={`p-4 rounded-xl border-2 text-center font-bold cursor-pointer transition-all h-20 flex items-center justify-center
                        ${isMatched ? 'bg-emerald-100 border-emerald-500 text-emerald-700 opacity-50 cursor-default' :
                          isSelected ? 'bg-blue-100 border-blue-500 text-blue-700 shadow-md scale-105' :
                          'bg-white border-slate-200 hover:border-blue-300'
                        }
                      `}
                    >
                      {pair.left}
                    </div>
                  )
                })}
              </div>
 
              <div className="w-px bg-slate-200 flex-col justify-around py-10 hidden md:flex">
                 {techPairs.map(p => <div key={p.id} className="w-3 h-3 bg-slate-300 rounded-full -ml-1.5" />)}

              <div className="flex-1 space-y-4">
                {shuffledRight.map(pair => {
                  const isMatched = matches.includes(pair.id);
                  return (
                    <div
                      key={`right-${pair.id}`}

                      className={`p-4 rounded-xl border-2 border-dashed text-center font-bold cursor-pointer transition-all h-20 flex items-center justify-center

        {type === 'innovation' && (

            <div className="text-center mt-8">
              <Button variant="secondary" onClick={checkTimeline} disabled={timelineChecked}>Kunci Urutan</Button>
            </div>
 
            {timelineChecked && (
              <div className={`absolute bottom-0 left-0 right-0 p-6 flex items-center justify-center
                ${timelineCorrect ? 'bg-emerald-500 text-white' : 'bg-amber-500 text-white'}

        )}
 
        {type === 'master' && (

            <div className="flex justify-between items-center mb-6">

                return (
                  <div
                    key={card.key}

                    className={`aspect-square rounded-xl flex items-center justify-center text-center p-2 cursor-pointer text-xs md:text-sm font-bold transition-all duration-300 select-none

            {solved.length === cards.length && (

};

// --- MAIN APP COMPONENT ---
function App() {
  const [user, setUser] = useState(null);
  const [activeView, setActiveView] = useState('dashboard');
  const [activeChallenge, setActiveChallenge] = useState(null);
 
  const [showLevelUp, setShowLevelUp] = useState(false);
  const [newBadgeToast, setNewBadgeToast] = useState(null);
 
  const handleLogin = () => {
    setUser(MOCK_USER);
    setActiveView('dashboard');
  };
 
  const handleLogout = () => {
    setUser(null);
  };
 
  const completeChallenge = (gainedXp, badgeName) => {
    setUser(prev => {
      let newXp = prev.xp + gainedXp;
      let newLevel = prev.level;
      let showedModal = false;
 
      if (newXp >= prev.nextLevelXp) {
        newLevel++;
        newXp = newXp - prev.nextLevelXp;
        showedModal = true;
      }
 
      if(showedModal) setShowLevelUp(true);
 
      const alreadyHasBadge = badgeName && prev.badges.includes(badgeName);
      if (badgeName && !alreadyHasBadge) {
        setTimeout(() => setNewBadgeToast(badgeName), showedModal ? 3200 : 300);
      }
 
      return {
        ...prev,
        xp: newXp,
        level: newLevel,
        badges: (badgeName && !alreadyHasBadge) ? [...prev.badges, badgeName] : prev.badges,
        currentPhase: prev.currentPhase < 4 ? prev.currentPhase + 1 : prev.currentPhase
      }
    });
 
    setActiveChallenge(null);
    setActiveView('dashboard');
 
    if(showLevelUp) {
      setTimeout(() => setShowLevelUp(false), 3000);
    }
  };
 
  useEffect(() => {
    if (newBadgeToast) {
      const t = setTimeout(() => setNewBadgeToast(null), 3500);
      return () => clearTimeout(t);
    }
  }, [newBadgeToast]);
 
  if (!user) {
    return <AuthView onLogin={handleLogin} />;
  }
 
  if (activeView === 'challenge' && activeChallenge) {
    return (
      <div className="h-screen bg-slate-50 font-sans">
        <ChallengeRunner
          type={activeChallenge}
          onComplete={completeChallenge}
          onCancel={() => { setActiveChallenge(null); setActiveView('board'); }}
        />
      </div>
    );
  }
 
  const renderView = () => {
    switch (activeView) {
      case 'dashboard': return <DashboardView user={user} navigate={setActiveView} />;
      case 'learning': return <LearningStudioView />;
      case 'vr': return <VRMuseumView />;
      case 'ai': return <AICompanionView />;
      case 'board': return <BoardGameProgressView user={user} setView={setActiveView} setActiveChallenge={setActiveChallenge} />;
      case 'qr': return <QRScannerView />;
      case 'leaderboard': return <LeaderboardView />;
      case 'profile': return <ProfileView user={user} />;
      default: return <DashboardView user={user} navigate={setActiveView} />;
    }
  };
 
  return (
    <>
      <Layout activeTab={activeView} setActiveTab={setActiveView} user={user} onLogout={handleLogout}>
        {renderView()}
      </Layout>
 
      {showLevelUp && (
        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm px-4">
          <div className="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl" style={{animation: 'bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards'}}>
            <div className="w-24 h-24 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-6">
              <Trophy className="w-12 h-12 text-amber-500" />
            </div>
            <h2 className="text-3xl font-bold text-slate-800 mb-2">Level Up!</h2>
            <p className="text-slate-600 mb-6">You have reached Level {user.level}. Your knowledge of Islamic civilization grows stronger.</p>
            <Button variant="primary" className="w-full" onClick={() => setShowLevelUp(false)}>Awesome!</Button>
          </div>
        </div>
      )}
 
      {newBadgeToast && (
        <div className="fixed top-6 right-6 z-[110] bg-white rounded-2xl shadow-2xl border border-amber-200 p-4 flex items-center gap-3 max-w-xs" style={{animation: 'slideInRight 0.4s ease-out forwards'}}>
          <div className="w-12 h-12 bg-amber-100 rounded-full flex items-center justify-center flex-shrink-0">
            <Shield className="w-6 h-6 text-amber-600" />
          </div>
          <div>
            <p className="text-xs font-semibold text-amber-600 uppercase tracking-wide">Lencana Baru</p>
            <p className="font-bold text-slate-800">{newBadgeToast}</p>
          </div>
        </div>
      )}
    </>
  );
}
 
const styleTag = document.createElement('style');
styleTag.innerHTML = `
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes scan { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }
  @keyframes bounceIn { 0% { transform: scale(0.8); opacity: 0; } 60% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes slideInRight { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
`;
document.head.appendChild(styleTag);
 
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
