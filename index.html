<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AVERRA</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0E2A47; color: white; font-family: Inter, Arial, sans-serif; }
    .loader { text-align: center; padding: 32px; }
    .compass { width: 58px; height: 58px; margin: 0 auto 18px; border-radius: 18px; display: grid; place-items: center; background: #C99700; font-size: 30px; animation: pulse 1.2s ease-in-out infinite; }
    .loader h1 { margin: 0 0 8px; letter-spacing: .08em; }
    .loader p { margin: 0; color: #c9d8e7; }
    .error { max-width: 720px; background: white; color: #18212f; border-radius: 20px; padding: 28px; text-align: left; box-shadow: 0 24px 70px rgba(0,0,0,.35); }
    .error h2 { color: #b42318; }
    @keyframes pulse { 50% { transform: scale(1.08) rotate(8deg); } }
  </style>
</head>
<body>
  <div id="boot" class="loader">
    <div class="compass">🧭</div>
    <h1>AVERRA</h1>
    <p>Menyiapkan Learning Studio...</p>
  </div>

  <script>
    (async function loadAverra() {
      const videos = {
        "c-w-1": { youtubeId: "76VlfldRa3E", title: "Biografi Ibnu Sina (Bapak Pengobatan Modern)", channel: "Muhammad Octa", duration: "11:48" },
        "c-w-2": { youtubeId: "Gl9qjeqXfEY", title: "Biografi Al Ghazali", channel: "Rindha Widyaningsih", duration: "12:49" },
        "c-w-3": { youtubeId: "aGhhOmpaVqc", title: "Video Animasi Ibnu Khaldun - Biografi", channel: "029_ Kurnia Habibah", duration: "11:17" },
        "c-n-1": { youtubeId: "RqHLePK0IZ8", title: "Ajaran Tasawuf Hamzah Fansuri dalam Kitab Syarab al-'Asyiqin", channel: "Putri Pandan Arum", duration: "13:09" },
        "c-n-2": { youtubeId: "hv2OKjQiWOA", title: "Biografi Ulama Terdahulu: Nuruddin ar-Raniri, Abdurrauf as-Singkili, dan Arsyad al-Banjari", channel: "Islam Nusantara - Unu Blitar", duration: "11:22" },
        "c-n-3": { youtubeId: "bM8KtnA7EC8", title: "Syaikh Abdur Rauf As-Singkili dan Syaikh Muhammad Arsyad Al-Banjari", channel: "Annisa", duration: "10:06" },
        "m-w-1": { youtubeId: "RRXZ2pEMoR0", title: "Muhammad Abduh: Biografi Singkat dan Pandangannya tentang Pendidikan", channel: "Albanjary Education", duration: "10:08" },
        "m-w-2": { youtubeId: "8Jai5iXXSY0", title: "Pendidikan Menurut Filsuf Muhammad Iqbal", channel: "Isty Nur Altsar", duration: "18:10" },
        "m-w-3": { youtubeId: "vrm_TIBoFBw", title: "Jamaluddin Al-Afghani", channel: "Santi Santi", duration: "15:04" },
        "m-n-1": { youtubeId: "WY1gdqGjghM", title: "Tokoh Penyebar Agama Islam di Indonesia", channel: "R A H P I J A", duration: "10:07" },
        "m-n-2": { youtubeId: "qf4N8z1ottE", title: "Teori Pemikiran Pendidikan KH Ahmad Dahlan", channel: "Rohman Hidayat", duration: "21:15" },
        "m-n-3": { youtubeId: "erWVBK35XYc", title: "SKI Kelas IX: Biografi KH Hasyim Asy'ari", channel: "LaMPeran", duration: "16:54" },
        "k-w-1": { youtubeId: "M7qY2GM2DsA", title: "Fazlur Rahman (1919-1988 M)", channel: "isrul khoiriyah", duration: "12:21" },
        "k-w-2": { youtubeId: "1BfRDJ3-BpI", title: "Ngaji Filsafat: Nestapa Manusia Modern - Hossein Nasr (1)", channel: "Media Koentji", duration: "24:52" },
        "k-w-3": { youtubeId: "myfNtU1-AUQ", title: "Ismail Raji Al-Faruqi: Biografi dan Islamisasi Sains", channel: "Albanjary Education", duration: "10:16" },
        "k-n-1": { youtubeId: "QiaHfYSlSFU", title: "Biografi Tokoh Harun Nasution dan Pemikirannya", channel: "Adnan", duration: "10:44" },
        "k-n-2": { youtubeId: "VLCwGI9_8JU", title: "Mengenang Cak Nur: Demokrasi dan Oposisi dalam Perspektif Cak Nur", channel: "Historia HMI", duration: "34:10" },
        "k-n-3": { youtubeId: "MGIBSmNc2H4", title: "Penulisan Biografi Kuntowijoyo: Sastrawan dan Ilmuwan Profetik", channel: "Agung Prihantoro", duration: "15:47" }
      };

      const response = await fetch("./app-base.html?v=learning-videos-1", { cache: "no-store" });
      if (!response.ok) throw new Error("File aplikasi dasar tidak dapat dimuat (HTTP " + response.status + ").");
      let html = await response.text();

      Object.entries(videos).forEach(([scholarId, video]) => {
        const escapedId = scholarId.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const linePattern = new RegExp("\\{ id: \\\"" + escapedId + "\\\",([^\\n]+)\\}");
        html = html.replace(linePattern, function (line) {
          let updated = line.replace(
            "{ id: \"" + scholarId + "\",",
            "{ id: \"" + scholarId + "\", youtubeId: " + JSON.stringify(video.youtubeId) + ", videoTitle: " + JSON.stringify(video.title) + ", videoChannel: " + JSON.stringify(video.channel) + ", videoDuration: " + JSON.stringify(video.duration) + ","
          );
          updated = updated.replace(/time: \"[^\"]+\"/, "time: " + JSON.stringify(video.duration));
          return updated;
        });
      });

      const playerStartMarker = "        <div className=\"bg-black rounded-2xl aspect-video flex items-center justify-center relative overflow-hidden shadow-lg group\">";
      const detailStartMarker = "        <div className=\"mt-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex-1 overflow-y-auto\">";
      const playerStart = html.indexOf(playerStartMarker);
      const detailStart = html.indexOf(detailStartMarker, playerStart);

      if (playerStart === -1 || detailStart === -1) {
        throw new Error("Komponen pemutar Learning Studio tidak ditemukan. Struktur app-base.html kemungkinan sudah berubah.");
      }

      const newPlayer = `        <div className="bg-black rounded-2xl overflow-hidden shadow-lg border border-slate-800">
          <div className="aspect-video bg-black">
            <iframe
              key={activeLesson.youtubeId}
              src={"https://www.youtube-nocookie.com/embed/" + activeLesson.youtubeId + "?rel=0&modestbranding=1"}
              title={"Video biografi " + activeLesson.name}
              className="w-full h-full border-0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerPolicy="strict-origin-when-cross-origin"
              allowFullScreen
            />
          </div>
          <div className="bg-[#0E2A47] text-white p-4 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">
            <div className="min-w-0">
              <Badge color="bg-[#C99700] text-white" className="mb-2 border border-white/20">
                <PlayCircle className="w-3 h-3 mr-1" /> Video Biografi Indonesia
              </Badge>
              <h2 className="text-xl md:text-2xl font-bold">{activeLesson.name}</h2>
              <p className="text-sm text-blue-100 mt-1 line-clamp-2">{activeLesson.videoTitle}</p>
            </div>
            <div className="flex flex-wrap items-center gap-2 text-xs text-blue-100 lg:justify-end">
              <span className="inline-flex items-center bg-white/10 px-3 py-1.5 rounded-full">
                <Clock className="w-3.5 h-3.5 mr-1.5" /> {activeLesson.videoDuration}
              </span>
              <span className="bg-white/10 px-3 py-1.5 rounded-full">{activeLesson.videoChannel}</span>
              <a
                href={"https://www.youtube.com/watch?v=" + activeLesson.youtubeId}
                target="_blank"
                rel="noopener noreferrer"
                className="bg-white text-[#0E2A47] px-3 py-1.5 rounded-full font-semibold hover:bg-blue-50"
              >
                Buka di YouTube ↗
              </a>
            </div>
          </div>
        </div>`;

      html = html.slice(0, playerStart) + newPlayer + "\n \n" + html.slice(detailStart);

      const oldTranscriptHeading = '<h3 className="text-lg font-bold text-slate-800 mt-6 mb-2">Transcript & Ringkasan</h3>';
      const newTranscriptHeading = '<h3 className="text-lg font-bold text-slate-800 mt-6 mb-2">Ringkasan & Panduan Menonton</h3>';
      html = html.replace(oldTranscriptHeading, newTranscriptHeading);

      const oldTranscriptParagraph = '<p>Selamat datang di Modul Scholar. Pada sesi ini, kita akan menyelami kehidupan <strong>{activeLesson.name}</strong>, salah satu tokoh penting dalam sejarah peradaban Islam yang gagasan-gagasannya melintasi batas waktu dan ruang...</p>';
      const newTranscriptParagraph = '<p>Simak video berbahasa Indonesia di atas untuk mengenal perjalanan hidup, karya, dan gagasan <strong>{activeLesson.name}</strong>. Catat tiga hal utama: latar kehidupan tokoh, kontribusi terpenting, dan relevansi pemikirannya untuk masa kini. Video dipilih sebagai bahan belajar eksternal; hak cipta tetap milik kanal YouTube masing-masing.</p>';
      html = html.replace(oldTranscriptParagraph, newTranscriptParagraph);

      document.open();
      document.write(html);
      document.close();
    })().catch(function (error) {
      console.error(error);
      document.body.innerHTML = '<div class="error"><h2>AVERRA gagal dimuat</h2><p>' + String(error.message || error) + '</p><p>Silakan muat ulang halaman atau periksa file <code>app-base.html</code> di repository.</p></div>';
    });
  </script>
</body>
</html>
